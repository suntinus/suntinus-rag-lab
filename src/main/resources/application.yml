server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8110
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
spring:
  application:
    name: suntinus-rag-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55438/rag}
    username: rag
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
  threads:
    virtual:
      enabled: true
  http:
    client:
      connect-timeout: 5s
      read-timeout: 180s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
lab:
  api-token: ${RAG_API_TOKEN}
  ollama-url: ${OLLAMA_URL:http://127.0.0.1:11438}
  embedding-model: bge-m3:latest
  embedding-revision: ${EMBEDDING_REVISION}
  chat-model: ${CHAT_MODEL:qwen2.5:1.5b}
